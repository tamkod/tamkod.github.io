<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tamkod</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            background: #f8f9fa;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1B365C;
            color: white;
            padding: 2.5rem 1.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        main {
            margin: 2.5rem auto 4rem;
            padding: 0 1.5rem;
            flex: 1;
        }

        .apps-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.25rem;
        }

        .app-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 360px;
            max-width: 100%;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.13);
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            flex-shrink: 0;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(27, 54, 92, 0.2);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 1rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 0.3rem;
        }

        .app-desc {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.5;
        }

        .app-badges {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.75rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 20px;
            background: #e8f0fe;
            color: #1B365C;
        }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #bbb;
            font-size: 0.8rem;
            border-top: 1px solid #eee;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.6rem; }
            .app-card { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>tamkod</h1>
    </header>

    <main>
        <div class="apps-grid">
            <a href="livecam/index.html" class="app-card">
                <div class="app-icon">
                    <img src="livecam/app-icon.png" alt="日本全国ライブカメラ">
                </div>
                <div class="app-info">
                    <div class="app-name">日本全国ライブカメラ</div>
                    <div class="app-desc">道路・河川・観光地の今をリアルタイムで確認。全国4000箇所以上のカメラに対応。</div>
                    <div class="app-badges">
                        <span class="badge">iOS</span>
                        <span class="badge">Android</span>
                        <span class="badge">無料</span>
                    </div>
                </div>
            </a>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 tamkod</p>
    </footer>

</body>
</html>
